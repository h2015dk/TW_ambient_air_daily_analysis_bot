name: Daily air quality report

on:
  repository_dispatch:
    types: [trigger-air-report]  # 接收外部 cron-job.org 的觸發訊號
  workflow_dispatch:            # 保留手動測試按鈕

permissions:
  contents: write

concurrency: aq-report

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - run: pip install -r requirements.txt

      - name: Build charts
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: python aqi_report.py build

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/images
          git commit -m "AQ charts $(TZ=Asia/Taipei date +%F -d yesterday)" || echo "nothing to commit"
          git push

      - name: Send to LINE
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: python aqi_report.py send
